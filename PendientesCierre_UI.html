<!-- ============================================================
     PENDIENTES DE CIERRE — Tab HTML
     Agregar dentro del <ul class="nav nav-tabs"> existente el tab,
     y dentro del <div class="tab-content"> el pane.
     El bloque <script> va al final del Index.html existente.
     ============================================================ -->

<!-- ① NAV TAB (pegar dentro del <ul class="nav nav-tabs">) -->
<!--
<li class="nav-item">
  <a class="nav-link" id="tab-pendientes" data-bs-toggle="tab" href="#pendientes" role="tab">
    Pendientes de Cierre
  </a>
</li>

<!-- ② TAB PANE (pegar dentro del <div class="tab-content">) -->
<div class="tab-pane fade" id="pendientes" role="tabpanel">

  <div class="d-flex align-items-center justify-content-between mb-3 mt-2">
    <h5 class="mb-0 fw-bold">Pendientes de Cierre — LOCAL 94</h5>
    <button class="btn btn-sm btn-outline-secondary" onclick="loadPendientes(true)">
      ↺ Actualizar
    </button>
  </div>

  <!-- Resumen de contadores -->
  <div class="row g-2 mb-3" id="pc-contadores" style="display:none!important"></div>

  <!-- Alertas: Recogido + estado inesperado -->
  <div id="pc-alertas-box" class="mb-3" style="display:none">
    <div class="alert alert-warning mb-0">
      <strong>⚠️ Órdenes con combinación de estados inesperada</strong>
      <div id="pc-alertas-list" class="mt-2"></div>
    </div>
  </div>

  <!-- Tabla pendientes -->
  <div id="pc-loading" class="text-center py-4">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2 text-muted small">Cargando pendientes…</p>
  </div>

  <div id="pc-tabla-wrap" style="display:none">
    <div class="table-responsive">
      <table class="table table-hover table-sm align-middle" id="pc-tabla">
        <thead class="table-dark">
          <tr>
            <th>Orden</th>
            <th>Estado</th>
            <th>Usuario Móvil</th>
            <th>Ventana Horaria</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="pc-tbody"></tbody>
      </table>
    </div>
    <p id="pc-empty" class="text-center text-muted py-4" style="display:none">
      No hay órdenes pendientes de cierre.
    </p>
  </div>

</div><!-- /tab-pane -->


<!-- ③ SCRIPT (pegar antes del </body> del Index.html) -->
<script>
// ── Pendientes de Cierre ──────────────────────────────────

document.getElementById('tab-pendientes').addEventListener('shown.bs.tab', function() {
  if (!document.getElementById('pc-tabla-wrap').dataset.loaded) {
    loadPendientes(false);
  }
});

function loadPendientes(forceRefresh) {
  var wrap    = document.getElementById('pc-tabla-wrap');
  var loading = document.getElementById('pc-loading');
  var empty   = document.getElementById('pc-empty');

  wrap.style.display    = 'none';
  loading.style.display = 'block';
  empty.style.display   = 'none';

  google.script.run
    .withSuccessHandler(function(data) {
      loading.style.display = 'none';
      wrap.style.display    = 'block';
      wrap.dataset.loaded   = '1';
      _renderPendientes(data);
    })
    .withFailureHandler(function(err) {
      loading.style.display = 'none';
      wrap.style.display    = 'block';
      document.getElementById('pc-tbody').innerHTML =
        '<tr><td colspan="5" class="text-danger text-center">Error: ' + err.message + '</td></tr>';
    })
    [forceRefresh ? 'clearPendientesCache' : 'getPendientesCierre']();

  if (forceRefresh) {
    // después de limpiar caché, volver a cargar
    if (forceRefresh) {
      google.script.run
        .withSuccessHandler(function() {
          google.script.run
            .withSuccessHandler(function(data) {
              loading.style.display = 'none';
              wrap.style.display    = 'block';
              wrap.dataset.loaded   = '1';
              _renderPendientes(data);
            })
            .getPendientesCierre();
        })
        .clearPendientesCache();
      return;
    }
  }
}

function _renderPendientes(data) {
  if (!data.ok) {
    document.getElementById('pc-tbody').innerHTML =
      '<tr><td colspan="5" class="text-danger text-center">' + (data.error || 'Error desconocido') + '</td></tr>';
    return;
  }

  // Contadores
  var cDiv = document.getElementById('pc-contadores');
  cDiv.style.cssText = '';
  cDiv.innerHTML = _cardContador('Pendientes', data.pendientes.length, 'warning') +
                   _cardContador('Alertas', data.alertas.length, 'danger') +
                   _cardContador('Finalizados', data.finalizados, 'success') +
                   _cardContador('Total Órdenes', data.totalOrdenes, 'secondary');

  // Alertas: Recogido + estado inesperado
  var alertasBox  = document.getElementById('pc-alertas-box');
  var alertasList = document.getElementById('pc-alertas-list');

  if (data.alertas.length > 0) {
    alertasBox.style.display = 'block';
    alertasList.innerHTML = data.alertas.map(function(a) {
      return '<div class="d-flex gap-2 align-items-start mb-1">' +
        '<span class="badge bg-danger">!</span>' +
        '<div>' +
          '<strong>Orden ' + _esc(a.orden) + '</strong>' +
          ' — Estados: <code>' + a.estados.map(_esc).join(' + ') + '</code>' +
          (a.usuario ? ' | Usuario: ' + _esc(a.usuario) : '') +
          (a.ventana ? ' | Ventana: ' + _esc(a.ventana) : '') +
        '</div>' +
      '</div>';
    }).join('');
  } else {
    alertasBox.style.display = 'none';
  }

  // Tabla pendientes
  var tbody = document.getElementById('pc-tbody');
  var empty = document.getElementById('pc-empty');

  if (data.pendientes.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';
  tbody.innerHTML = data.pendientes.map(function(p) {
    var estadoBadge = _estadoBadge(p.estado);
    var dupBadge    = p.duplicado
      ? '<span class="badge bg-secondary ms-1" title="Orden con múltiples registros">dup</span>'
      : '';
    return '<tr>' +
      '<td class="fw-semibold">' + _esc(p.orden) + dupBadge + '</td>' +
      '<td>' + estadoBadge + '</td>' +
      '<td>' + _esc(p.usuario || '—') + '</td>' +
      '<td><span class="badge bg-light text-dark border">' + _esc(p.ventana || '—') + '</span></td>' +
      '<td></td>' +
    '</tr>';
  }).join('');
}

function _cardContador(label, valor, color) {
  return '<div class="col-6 col-md-3">' +
    '<div class="card border-' + color + ' text-center py-2">' +
      '<div class="fs-4 fw-bold text-' + color + '">' + valor + '</div>' +
      '<div class="small text-muted">' + label + '</div>' +
    '</div>' +
  '</div>';
}

function _estadoBadge(estado) {
  var map = {
    'RECOGIDO'  : 'bg-info text-dark',
    'ENTREGADO' : 'bg-success',
    'PENDIENTE' : 'bg-warning text-dark',
    'ASIGNADO'  : 'bg-primary',
    'CANCELADO' : 'bg-danger'
  };
  var cls = map[(estado || '').toUpperCase()] || 'bg-secondary';
  return '<span class="badge ' + cls + '">' + _esc(estado || '—') + '</span>';
}

function _esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
